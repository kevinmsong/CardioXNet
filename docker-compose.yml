services:
  # Single service: FastAPI serves both the server-rendered UI and the JSON API on :8000.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardioxnet
    ports:
      - "8000:8000"
    environment:
      - NETS_ENVIRONMENT=production
      - NETS_DEBUG=false
      - NETS_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped

volumes:
  data:
  outputs:
